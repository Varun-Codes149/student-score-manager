
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Score Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #0f172a;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 1200px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0 12px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
}

button {
    padding: 10px 15px;
    margin: 4px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-weight: bold;
}

button:hover {
    opacity: 0.85;
}

.danger {
    background: #dc2626;
}

.success {
    background: #16a34a;
}

.gray {
    background: #64748b;
}

.results {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.result-box {
    background: #f8fafc;
    border-radius: 8px;
    padding: 15px;
    text-align: center;
}

.result-box strong {
    display: block;
    font-size: 20px;
    margin-top: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #e2e8f0;
    text-align: center;
}

th {
    background: #e2e8f0;
}

.search {
    max-width: 300px;
}

.pass {
    color: green;
    font-weight: bold;
}

.fail {
    color: red;
    font-weight: bold;
}

@media(max-width: 800px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .results {
        grid-template-columns: 1fr 1fr;
    }

    table {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>STUDENT SCORE MANAGER</h1>
    <p>Student Result Management System</p>
</header>

<div class="container">

<div class="grid">

<div class="card">

<h2>Student Details</h2>

<label>Student Name</label>
<input id="name" type="text">

<label>Roll Number</label>
<input id="roll" type="text">

<label>Class</label>
<input id="className" type="text">

<label>Section</label>
<input id="section" type="text">

<h2>Subject Marks</h2>

<label>Mathematics</label>
<input id="math" type="number" min="0" max="100">

<label>Physical Science</label>
<input id="physics" type="number" min="0" max="100">

<label>Biology</label>
<input id="biology" type="number" min="0" max="100">

<label>English</label>
<input id="english" type="number" min="0" max="100">

<label>Telugu</label>
<input id="telugu" type="number" min="0" max="100">

<label>Social Studies</label>
<input id="social" type="number" min="0" max="100">

<button onclick="calculate()">Calculate</button>
<button class="success" onclick="saveStudent()">Save Student</button>
<button class="gray" onclick="clearForm()">Clear</button>

</div>


<div class="card">

<h2>Result</h2>

<div class="results">

<div class="result-box">
Total
<strong id="total">0 / 600</strong>
</div>

<div class="result-box">
Average
<strong id="average">0</strong>
</div>

<div class="result-box">
Percentage
<strong id="percentage">0%</strong>
</div>

<div class="result-box">
Grade
<strong id="grade">-</strong>
</div>

<div class="result-box">
Result
<strong id="result">-</strong>
</div>

<div class="result-box">
Highest
<strong id="highest">-</strong>
</div>

</div>

<h3>Lowest Subject</h3>
<p id="lowest">-</p>

</div>

</div>


<div class="card">

<h2>Student Records</h2>

<input
    class="search"
    id="search"
    placeholder="Search name or roll number"
    oninput="displayStudents()"
>

<button onclick="showTopper()">Class Topper</button>
<button onclick="showAverage()">Class Average</button>
<button onclick="exportCSV()">Export CSV</button>

<table>

<thead>
<tr>
<th>Roll</th>
<th>Name</th>
<th>Class</th>
<th>Total</th>
<th>Percentage</th>
<th>Grade</th>
<th>Result</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="studentTable"></tbody>

</table>

</div>

</div>


<script>

let students = JSON.parse(localStorage.getItem("students")) || [];

const subjects = [
    "math",
    "physics",
    "biology",
    "english",
    "telugu",
    "social"
];

function getMarks() {

    let marks = [];

    for (let subject of subjects) {

        let value = Number(document.getElementById(subject).value);

        if (
            document.getElementById(subject).value === "" ||
            value < 0 ||
            value > 100
        ) {
            alert("Enter valid marks between 0 and 100.");
            return null;
        }

        marks.push(value);
    }

    return marks;
}


function calculateResult(marks) {

    let total = marks.reduce((a,b) => a+b, 0);

    let average = total / 6;

    let percentage = total / 6;

    let grade;

    if (percentage >= 90)
        grade = "A+";
    else if (percentage >= 80)
        grade = "A";
    else if (percentage >= 70)
        grade = "B";
    else if (percentage >= 60)
        grade = "C";
    else if (percentage >= 50)
        grade = "D";
    else if (percentage >= 35)
        grade = "E";
    else
        grade = "F";

    let passed = marks.every(mark => mark >= 35);

    let highestIndex = marks.indexOf(Math.max(...marks));
    let lowestIndex = marks.indexOf(Math.min(...marks));

    let subjectNames = [
        "Mathematics",
        "Physical Science",
        "Biology",
        "English",
        "Telugu",
        "Social Studies"
    ];

    return {
        total,
        average,
        percentage,
        grade,
        passed,
        highest: subjectNames[highestIndex],
        lowest: subjectNames[lowestIndex]
    };
}


function calculate() {

    let marks = getMarks();

    if (!marks)
        return;

    let result = calculateResult(marks);

    document.getElementById("total").textContent =
        result.total + " / 600";

    document.getElementById("average").textContent =
        result.average.toFixed(2);

    document.getElementById("percentage").textContent =
        result.percentage.toFixed(2) + "%";

    document.getElementById("grade").textContent =
        result.grade;

    document.getElementById("result").textContent =
        result.passed ? "PASS" : "FAIL";

    document.getElementById("result").className =
        result.passed ? "pass" : "fail";

    document.getElementById("highest").textContent =
        result.highest;

    document.getElementById("lowest").textContent =
        result.lowest;
}


function saveStudent() {

    let name = document.getElementById("name").value.trim();
    let roll = document.getElementById("roll").value.trim();
    let className = document.getElementById("className").value.trim();
    let section = document.getElementById("section").value.trim();

    if (!name || !roll || !className || !section) {
        alert("Please fill all student details.");
        return;
    }

    let marks = getMarks();

    if (!marks)
        return;

    let result = calculateResult(marks);

    let student = {
        name,
        roll,
        className,
        section,
        marks,
        ...result
    };

    let existing = students.findIndex(s => s.roll === roll);

    if (existing >= 0) {
        students[existing] = student;
    } else {
        students.push(student);
    }

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

    calculate();

    displayStudents();

    alert("Student saved successfully.");
}


function displayStudents() {

    let table = document.getElementById("studentTable");

    table.innerHTML = "";

    let search =
        document.getElementById("search").value.toLowerCase();

    let filtered = students.filter(student =>
        student.name.toLowerCase().includes(search) ||
        student.roll.toLowerCase().includes(search)
    );

    filtered.forEach(student => {

        let row = table.insertRow();

        row.innerHTML = `
        <td>${student.roll}</td>
        <td>${student.name}</td>
        <td>${student.className}</td>
        <td>${student.total}</td>
        <td>${student.percentage.toFixed(2)}%</td>
        <td>${student.grade}</td>
        <td class="${student.passed ? "pass" : "fail"}">
            ${student.passed ? "PASS" : "FAIL"}
        </td>
        <td>
            <button onclick="loadStudent('${student.roll}')">
                Load
            </button>

            <button class="danger"
                onclick="deleteStudent('${student.roll}')">
                Delete
            </button>
        </td>
        `;
    });
}


function loadStudent(roll) {

    let student =
        students.find(s => s.roll === roll);

    if (!student)
        return;

    document.getElementById("name").value =
        student.name;

    document.getElementById("roll").value =
        student.roll;

    document.getElementById("className").value =
        student.className;

    document.getElementById("section").value =
        student.section;

    subjects.forEach((subject, index) => {

        document.getElementById(subject).value =
            student.marks[index];

    });

    calculate();
}


function deleteStudent(roll) {

    if (!confirm("Delete this student?"))
        return;

    students =
        students.filter(student => student.roll !== roll);

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

    displayStudents();
}


function clearForm() {

    document.querySelectorAll("input").forEach(input => {

        if (input.id !== "search")
            input.value = "";

    });

    document.getElementById("total").textContent =
        "0 / 600";

    document.getElementById("average").textContent =
        "0";

    document.getElementById("percentage").textContent =
        "0%";

    document.getElementById("grade").textContent =
        "-";

    document.getElementById("result").textContent =
        "-";

    document.getElementById("highest").textContent =
        "-";

    document.getElementById("lowest").textContent =
        "-";
}


function showTopper() {

    if (students.length === 0) {
        alert("No students available.");
        return;
    }

    let topper =
        students.reduce((best, student) =>
            student.percentage > best.percentage
                ? student
                : best
        );

    alert(
        "CLASS TOPPER\n\n" +
        "Name: " + topper.name + "\n" +
        "Roll: " + topper.roll + "\n" +
        "Percentage: " +
        topper.percentage.toFixed(2) + "%\n" +
        "Grade: " + topper.grade
    );
}


function showAverage() {

    if (students.length === 0) {
        alert("No students available.");
        return;
    }

    let average =
        students.reduce(
            (sum, student) =>
                sum + student.percentage,
            0
        ) / students.length;

    alert(
        "CLASS STATISTICS\n\n" +
        "Students: " + students.length +
        "\nClass Average: " +
        average.toFixed(2) + "%"
    );
}


function exportCSV() {

    if (students.length === 0) {
        alert("No records to export.");
        return;
    }

    let csv =
        "Roll,Name,Class,Section,Total,Percentage,Grade,Result\n";

    students.forEach(student => {

        csv +=
            `"${student.roll}",` +
            `"${student.name}",` +
            `"${student.className}",` +
            `"${student.section}",` +
            `${student.total},` +
            `${student.percentage.toFixed(2)},` +
            `${student.grade},` +
            `${student.passed ? "PASS" : "FAIL"}\n`;
    });

    let blob =
        new Blob([csv], {type: "text/csv"});

    let url =
        URL.createObjectURL(blob);

    let a =
        document.createElement("a");

    a.href = url;

    a.download =
        "student_records.csv";

    a.click();

    URL.revokeObjectURL(url);
}


displayStudents();

</script>

</body>
</html>
